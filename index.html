<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerShellコマンド検索</title>
<meta name="description" content="PowerShellのコマンドをコマンド名や『したいこと』から検索できるツールです。">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <a href="#/" class="app-title">PowerShellコマンド検索</a>
</header>

<div class="layout">

  <!-- 左側：検索パネル（常時表示） -->
  <aside class="panel-search">
    <form id="form-name" class="search-card" autocomplete="off">
      <label for="input-name">コマンド名で検索</label>
      <textarea id="input-name" rows="2" placeholder="例）Get-ChildItem、または ls"></textarea>
      <button type="submit" class="btn btn-primary">検索</button>
    </form>

    <form id="form-intent" class="search-card" autocomplete="off">
      <label for="input-intent">したいことで検索</label>
      <textarea id="input-intent" rows="2" placeholder="例）ファイルを削除したい"></textarea>
      <button type="submit" class="btn btn-primary">検索</button>
    </form>

    <div class="search-card actions-card">
      <a href="#/list" class="btn btn-secondary">全コマンド一覧を表示</a>
      <button type="button" id="btn-reset" class="btn btn-ghost">検索をリセット</button>
    </div>
  </aside>

  <!-- 右側：検索結果・詳細を表示するパネル -->
  <section class="panel-content">

    <div class="content-view" id="view-idle">
      <div class="idle-placeholder">
        <p>左のフォームからコマンド名や「したいこと」を入力して検索するか、「全コマンド一覧を表示」から探してみてください。</p>
        <p>検索結果や詳細はこちらに表示されます。</p>
      </div>
    </div>

    <div class="content-view" id="view-results" hidden>
      <h2 id="results-heading">検索結果</h2>
      <p id="results-empty" class="empty-message" hidden>該当するコマンドが見つかりませんでした。キーワードを変えて試すか、全コマンド一覧から探してみてください。</p>
      <ul id="results-list" class="result-list"></ul>
    </div>

    <div class="content-view" id="view-list" hidden>
      <h2>全コマンド一覧</h2>
      <div id="category-list"></div>
    </div>

    <div class="content-view" id="view-detail" hidden>
      <button type="button" class="back-link" id="detail-back">&larr; 戻る</button>
      <div id="detail-content"></div>
    </div>

  </section>

</div>

<footer class="app-footer">
  <p>掲載しているコマンド情報は代表的な使い方をまとめたものです。正式な仕様は<a href="https://learn.microsoft.com/powershell/" target="_blank" rel="noopener">Microsoft公式ドキュメント</a>もご確認ください。</p>
</footer>

<script src="data/commands.js"></script>
<script src="app.js"></script>
</body>
</html>
